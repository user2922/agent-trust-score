name: CI

# The repository's default branch is `master`, not `main`. A workflow watching
# the wrong branch never runs, and an empty run history is indistinguishable
# from a passing one.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run mypy agent_trust

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_secrets.sh

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python -m pytest

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - run: ls -l dist/

  determinism:
    name: determinism (rule D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # Same commit, same numbers -- on Linux as well as on the dev machine.
      - run: uv run python -m pytest tests/test_determinism.py -q --no-cov

  acceptance:
    name: acceptance (the four criteria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # Clean fixture scores well with zero secrets; ugly fixture grades F with
      # a finding on every axis; no artifact leaks the planted key.
      - run: uv run python -m pytest tests/test_acceptance.py -q --no-cov
      - run: uv run python scripts/generate_checks_doc.py --check
